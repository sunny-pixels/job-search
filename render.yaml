services:
  - type: web
    name: resume-agent-backend
    env: node
    region: oregon
    plan: free
    buildCommand: |
      cd backend && npm install
      cd ../scraper-service && pip install -r requirements.txt
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
